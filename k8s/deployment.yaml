
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bike-price-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bike-price-api
  template:
    metadata:
      labels:
        app: bike-price-api
    spec:
      containers:
        - name: bike-price-api
          image: bike-price-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
